<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>食物連鎖チャレンジ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf8ef;font-family:sans-serif;text-align:center}
#app{max-width:800px;margin:auto;padding:10px}
h1{margin:7px}
button,select{font-size:17px;padding:10px;margin:5px;border:0;border-radius:10px}
button{background:#198448;color:#fff;font-weight:bold}
#lifeBox{
 position:fixed;top:8px;left:8px;z-index:9;background:#fff;
 padding:7px 12px;border-radius:12px;font-size:22px
}
#status{font-size:18px;font-weight:bold;margin:8px}
#guide{min-height:42px;font-size:17px}
#controls{font-size:15px;color:#356b3d;margin:-5px 0 7px}

#field{
 width:100%;height:min(500px,65vh);position:relative;overflow:hidden;
 border:3px solid #62a763;border-radius:18px;
 background:linear-gradient(#bdeaff,#e9f8d4);touch-action:none
}

#player{
 position:absolute;font-size:56px;z-index:3;touch-action:none;
 user-select:none;-webkit-user-select:none;
 filter:drop-shadow(2px 3px 2px #777)
}

.food{
 position:absolute;font-size:45px;pointer-events:none;
 animation:fall var(--speed) linear forwards
}

.effect{
 position:absolute;z-index:5;pointer-events:none;
 color:#e85d00;font-weight:bold;font-size:20px;
 text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff;
 animation:popup .9s ease-out forwards;
 white-space:nowrap
}

@keyframes fall{
 from{top:-60px}
 to{top:110%}
}

@keyframes popup{
 0%{opacity:0;transform:translateY(10px) scale(.7)}
 20%{opacity:1;transform:translateY(0) scale(1.15)}
 100%{opacity:0;transform:translateY(-55px) scale(1)}
}

.grow{animation:grow .5s ease}
@keyframes grow{50%{transform:scale(1.55)}}

.answer{
 background:#fff;padding:14px;border-radius:12px;
 margin-top:8px;line-height:1.9;font-size:18px
}
.clear{color:#12863e;font-size:25px;font-weight:bold}

@media(max-width:600px){
 #app{padding:6px}
 h1{font-size:24px}
 #status,#guide{font-size:15px}
 #controls{font-size:14px}
 #field{height:62vh;min-height:380px;border-radius:14px}
 #player{font-size:50px}
 .food{font-size:38px}
 button,select{font-size:16px;padding:9px}
 #lifeBox{font-size:18px;padding:5px 8px}
}
</style>
</head>

<body>
<div id="lifeBox">❤️❤️❤️</div>

<div id="app">
<h1>食物連鎖チャレンジ！</h1>

<div id="menu">
  <p>正しい餌を食べて進化しよう！</p>

  <label>難易度：
    <select id="difficulty">
      <option value="easy">かんたん</option>
      <option value="normal">ふつう</option>
      <option value="hard">むずかしい</option>
    </select>
  </label><br>

  <button onclick="start('forest')">🌲 森林ではじめる</button>
  <button onclick="start('water')">🌊 水界ではじめる</button>

  <p>
    正解：+10点・+1秒<br>
    5匹連続正解：進化<br>
    最後の捕食者で5匹食べる：クリア<br>
    クリア時：残り時間1秒につき+1点<br>
    不正解：❤️-1
  </p>
</div>

<div id="play" hidden>
  <div id="status"></div>
  <div id="guide"></div>
  <div id="controls">☝️ 左右にドラッグして動かそう</div>
  <div id="field"><div id="player"></div></div>
</div>
</div>

<script>
const TIME_BONUS=1;

const worlds={
  forest:{
    chain:[
      ["🦗","バッタ",["🌿","🍃","🌱","☘️"]],
      ["🐸","カエル",["🦗","🐛","🪲","🪰"]],
      ["🐍","ヘビ",["🐸","🐭","🦎"]]
    ],
    wrong:["🐰","🍄","🐟","🦀","🐢","🦅"]
  },
  water:{
    chain:[
      ["🦐","動物プランクトン",["🦠","🌿","🪸"]],
      ["🐟","小形魚類",["🦐","🪱","🦠","🦀"]],
      ["🐠","大形魚類",["🐟","🐡","🦐","🦑"]]
    ],
    wrong:["🐢","🐸","🍄","🐰","🦅","🦎"]
  }
};

const settings={
  easy:{rate:0.72,speed:7,spawn:950},
  normal:{rate:0.53,speed:5,spawn:750},
  hard:{rate:0.35,speed:3.5,spawn:600}
};

const menu=document.querySelector("#menu");
const play=document.querySelector("#play");
const field=document.querySelector("#field");
const player=document.querySelector("#player");
const status=document.querySelector("#status");
const guide=document.querySelector("#guide");
const lifeBox=document.querySelector("#lifeBox");
const difficulty=document.querySelector("#difficulty");

let world,setting,level,correct,score,life,time;
let spawnTimer,clockTimer,hitTimer;
let dragging=false;
let gameRunning=false;

function clearTimers(){
  clearInterval(spawnTimer);
  clearInterval(clockTimer);
  clearInterval(hitTimer);
}

function start(name){
  clearTimers();

  world=worlds[name];
  setting=settings[difficulty.value];

  level=0;
  correct=0;
  score=0;
  life=3;
  time=30;
  gameRunning=true;

  menu.hidden=true;
  play.hidden=false;
  player.style.display="block";

  update();

  requestAnimationFrame(()=>{
    player.style.left=(field.clientWidth-player.offsetWidth)/2+"px";
    player.style.top=(field.clientHeight-player.offsetHeight-12)+"px";
  });

  spawnTimer=setInterval(spawnFood,setting.spawn);

  hitTimer=setInterval(()=>{
    if(gameRunning)checkHit();
  },50);

  clockTimer=setInterval(()=>{
    if(!gameRunning)return;

    time--;

    if(time<=0){
      endGame();
    }else{
      update();
    }
  },1000);
}

function update(){
  if(!world)return;

  lifeBox.textContent="❤️".repeat(life);

  const target=level===2
    ?`クリアまで：${5-correct}匹`
    :`進化まで：${5-correct}匹`;

  status.textContent=
    `得点：${score}点　｜　残り：${time}秒　｜　段階：${level+1}/3　｜　${target}`;

  player.textContent=world.chain[level][0];

  if(level===2){
    guide.textContent=`${world.chain[level][1]}で5匹食べたらクリア！`;
  }else{
    guide.textContent=`${world.chain[level][1]}になって、正しい餌を食べよう！`;
  }
}

function spawnFood(){
  if(!gameRunning)return;

  const isCorrect=Math.random()<setting.rate;
  const food=document.createElement("div");
  const correctFoods=world.chain[level][2];

  food.className="food";
  food.dataset.correct=isCorrect?"yes":"no";

  food.textContent=isCorrect
    ?correctFoods[Math.floor(Math.random()*correctFoods.length)]
    :world.wrong[Math.floor(Math.random()*world.wrong.length)];

  food.style.left=(Math.random()*87)+"%";
  food.style.setProperty("--speed",setting.speed+"s");

  field.appendChild(food);

  setTimeout(()=>food.remove(),setting.speed*1000+300);
}

function showEffect(text){
  const effect=document.createElement("div");
  const playerRect=player.getBoundingClientRect();
  const fieldRect=field.getBoundingClientRect();

  effect.className="effect";
  effect.textContent=text;

  effect.style.left=
    (playerRect.left-fieldRect.left+playerRect.width/2-45)+"px";

  effect.style.top=
    (playerRect.top-fieldRect.top-10)+"px";

  field.appendChild(effect);

  setTimeout(()=>effect.remove(),900);
}

player.addEventListener("pointerdown",event=>{
  if(!gameRunning)return;

  dragging=true;
  player.setPointerCapture(event.pointerId);
  event.preventDefault();
});

player.addEventListener("pointermove",event=>{
  if(dragging&&gameRunning)movePlayer(event.clientX);
});

player.addEventListener("pointerup",()=>dragging=false);
player.addEventListener("pointercancel",()=>dragging=false);

function movePlayer(x){
  const rect=field.getBoundingClientRect();
  const playerRect=player.getBoundingClientRect();

  const left=Math.max(
    0,
    Math.min(
      rect.width-playerRect.width,
      x-rect.left-playerRect.width/2
    )
  );

  player.style.left=left+"px";
}

function checkHit(){
  const playerRect=player.getBoundingClientRect();

  document.querySelectorAll(".food").forEach(food=>{
    if(!gameRunning)return;

    const foodRect=food.getBoundingClientRect();
    const isCorrect=food.dataset.correct==="yes";

    const playerSide=18;
    const playerTop=22;
    const playerBottom=14;
    const foodMargin=isCorrect?8:14;

    const hit=
      playerRect.left+playerSide < foodRect.right-foodMargin &&
      playerRect.right-playerSide > foodRect.left+foodMargin &&
      playerRect.top+playerTop < foodRect.bottom-foodMargin &&
      playerRect.bottom-playerBottom > foodRect.top+foodMargin;

    if(!hit)return;

    food.remove();

    if(isCorrect){
      score+=10;
      time+=1;
      correct++;

      showEffect("+10点　+1秒");

      if(level===2&&correct>=5){
        clearGame();
        return;
      }

      if(correct>=5){
        correct=0;
        level++;

        player.classList.remove("grow");
        void player.offsetWidth;
        player.classList.add("grow");

        showEffect("進化！");
      }

      update();

    }else{
      life--;
      correct=0;

      if(life<=0){
        endGame();
        return;
      }

      update();
    }
  });
}

function clearGame(){
  if(!gameRunning)return;

  gameRunning=false;
  dragging=false;
  clearTimers();

  document.querySelectorAll(".food").forEach(food=>food.remove());

  const baseScore=score;
  const timeBonus=time*TIME_BONUS;
  score+=timeBonus;

  player.style.display="none";
  lifeBox.textContent="";

  const answers=world.chain.map((item,index)=>
    `段階${index+1}：${item[1]} ${item[0]} ← ${item[2].join("・")}`
  ).join("<br>");

  guide.innerHTML=`
    <div class="answer">
      <div class="clear">🎉 クリア！ 🎉</div>
      捕食スコア：<b>${baseScore}点</b><br>
      残り時間ボーナス：<b>${time}秒 × ${TIME_BONUS}点 = ${timeBonus}点</b><br>
      最終スコア：<b>${score}点</b>
      <hr>
      <b>食物連鎖の答え</b><br>
      ${answers}<br>
      <button onclick="backToMenu()">メニューへ戻る</button>
    </div>
  `;
}

function endGame(){
  if(!gameRunning)return;

  gameRunning=false;
  dragging=false;
  clearTimers();

  document.querySelectorAll(".food").forEach(food=>food.remove());

  player.style.display="none";
  lifeBox.textContent="";

  guide.innerHTML=`
    <div class="answer">
      <b>🎮 ゲームオーバー</b><br>
      最終スコア：<b>${score}点</b><br>
      <button onclick="backToMenu()">メニューへ戻る</button>
    </div>
  `;
}

function backToMenu(){
  clearTimers();

  document.querySelectorAll(".food").forEach(food=>food.remove());

  play.hidden=true;
  menu.hidden=false;

  lifeBox.textContent="❤️❤️❤️";
  guide.textContent="";
  gameRunning=false;
}
</script>
</body>
</html>
