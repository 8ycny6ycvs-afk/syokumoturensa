<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>食物連鎖チャレンジ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf8ef;font-family:sans-serif;text-align:center}
#app{max-width:800px;margin:auto;padding:10px}
h1{margin:7px}
button,select{font-size:17px;padding:10px;margin:5px;border:0;border-radius:10px}
button{background:#198448;color:#fff;font-weight:bold}
#lifeBox{position:fixed;top:8px;left:8px;z-index:9;background:#fff;padding:7px 12px;border-radius:12px;font-size:22px}
#status{font-size:18px;font-weight:bold;margin:8px}
#guide{min-height:42px;font-size:17px}
#controls{font-size:15px;color:#356b3d;margin:-5px 0 7px}
#field{
 width:100%;height:min(500px,65vh);position:relative;overflow:hidden;
 border:3px solid #62a763;border-radius:18px;
 background:linear-gradient(#bdeaff,#e9f8d4);touch-action:none
}
#player{
 position:absolute;font-size:56px;z-index:3;touch-action:none;
 user-select:none;-webkit-user-select:none;
 filter:drop-shadow(2px 3px 2px #777)
}
.food{
 position:absolute;font-size:45px;pointer-events:none;
 animation:fall var(--speed) linear forwards
}
@keyframes fall{from{top:-60px}to{top:110%}}
.grow{animation:grow .5s ease}
@keyframes grow{50%{transform:scale(1.55)}}
.answer{background:#fff;padding:10px;border-radius:12px;margin-top:8px;line-height:1.8}

@media(max-width:600px){
 #app{padding:6px}
 h1{font-size:24px}
 #status,#guide{font-size:15px}
 #controls{font-size:14px}
 #field{height:62vh;min-height:380px;border-radius:14px}
 #player{font-size:50px}
 .food{font-size:38px}
 button,select{font-size:16px;padding:9px}
 #lifeBox{font-size:18px;padding:5px 8px}
}
</style>
</head>

<body>
<div id="lifeBox">❤️❤️❤️</div>

<div id="app">
<h1>食物連鎖チャレンジ！</h1>

<div id="menu">
<p>正しい餌を食べて進化しよう！</p>

<label>難易度：
<select id="difficulty">
<option value="easy">かんたん</option>
<option value="normal">ふつう</option>
<option value="hard">むずかしい</option>
</select>
</label><br>

<button onclick="start('forest')">🌲 森林ではじめる</button>
<button onclick="start('water')">🌊 水界ではじめる</button>

<p>正解：+10点 ／ 5匹連続正解：進化 ／ 不正解：❤️-1</p>
</div>

<div id="play" hidden>
<div id="status"></div>
<div id="guide"></div>
<div id="controls">☝️ 左右にドラッグして動かそう</div>
<div id="field"><div id="player"></div></div>
</div>
</div>

<script>
const worlds={
 forest:{
  chain:[
   ["🦗","バッタ",["🌿","🍃","🌱","☘️"]],
   ["🐸","カエル",["🦗","🐛","🪲","🪰"]],
   ["🐍","ヘビ",["🐸","🐭","🦎"]]
  ],
  wrong:["🐰","🍄","🐟","🦀","🐢","🦅"]
 },
 water:{
  chain:[
   ["🦐","動物プランクトン",["🦠","🌿","🪸"]],
   ["🐟","小形魚類",["🦐","🪱","🦠","🦀"]],
   ["🐠","大形魚類",["🐟","🐡","🦐","🦑"]]
  ],
  wrong:["🐢","🐸","🍄","🐰","🦅","🦎"]
 }
};

const settings={
 easy:{rate:0.72,speed:7,spawn:950},
 normal:{rate:0.53,speed:5,spawn:750},
 hard:{rate:0.35,speed:3.5,spawn:600}
};

const menu=document.querySelector("#menu");
const play=document.querySelector("#play");
const field=document.querySelector("#field");
const player=document.querySelector("#player");
const status=document.querySelector("#status");
const guide=document.querySelector("#guide");
const lifeBox=document.querySelector("#lifeBox");
const difficulty=document.querySelector("#difficulty");

let world,setting,level,correct,score,life,time;
let spawnTimer,clockTimer,hitTimer;
let dragging=false,gameRunning=false;
let audioCtx,bgmTimer;

function getAudio(){
 if(!audioCtx){
  const AudioContext=window.AudioContext||window.webkitAudioContext;
  audioCtx=new AudioContext();
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
 return audioCtx;
}

function tone(freq,length=0.16,volume=0.08,type="sine"){
 try{
  const ctx=getAudio();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type;
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(volume,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+length);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+length);
 }catch(e){}
}

function sound(type){
 if(type==="ok")tone(880,0.14,0.09,"sine");
 if(type==="bad")tone(160,0.25,0.1,"sawtooth");
 if(type==="up"){
  tone(660,0.12,0.08,"triangle");
  setTimeout(()=>tone(990,0.2,0.1,"triangle"),100);
 }
}

function startBGM(){
 stopBGM();
 const melody=[262,330,392,330,294,349,440,349];
 let note=0;
 bgmTimer=setInterval(()=>{
  tone(melody[note],0.22,0.025,"triangle");
  note=(note+1)%melody.length;
 },300);
}

function stopBGM(){
 clearInterval(bgmTimer);
 bgmTimer=null;
}

function start(name){
 clearInterval(spawnTimer);
 clearInterval(clockTimer);
 clearInterval(hitTimer);

 world=worlds[name];
 setting=settings[difficulty.value];
 level=0;
 correct=0;
 score=0;
 life=3;
 time=30;
 gameRunning=true;

 menu.hidden=true;
 play.hidden=false;
 player.style.display="block";

 update();

 requestAnimationFrame(()=>{
  player.style.left=(field.clientWidth-player.offsetWidth)/2+"px";
  player.style.top=(field.clientHeight-player.offsetHeight-12)+"px";
 });

 startBGM();
 spawnTimer=setInterval(spawnFood,setting.spawn);

 hitTimer=setInterval(()=>{
  if(gameRunning)checkHit();
 },50);

 clockTimer=setInterval(()=>{
  if(!gameRunning)return;
  time--;
  if(time<=0)endGame();
  else update();
 },1000);
}

function update(){
 if(!world)return;

 lifeBox.textContent="❤️".repeat(life);
 status.textContent=
 `得点：${score}点　｜　残り：${time}秒　｜　段階：${level+1}/3　｜　進化まで：${5-correct}匹`;

 player.textContent=world.chain[level][0];
 guide.textContent=`${world.chain[level][1]}になって、正しい餌を食べよう！`;
}

function spawnFood(){
 if(!gameRunning)return;

 const isCorrect=Math.random()<setting.rate;
 const food=document.createElement("div");
 const correctFoods=world.chain[level][2];

 food.className="food";
 food.dataset.correct=isCorrect?"yes":"no";
 food.textContent=isCorrect
  ?correctFoods[Math.floor(Math.random()*correctFoods.length)]
  :world.wrong[Math.floor(Math.random()*world.wrong.length)];

 food.style.left=(Math.random()*87)+"%";
 food.style.setProperty("--speed",setting.speed+"s");
 field.appendChild(food);

 setTimeout(()=>food.remove(),setting.speed*1000+300);
}

player.addEventListener("pointerdown",event=>{
 if(!gameRunning)return;
 dragging=true;
 player.setPointerCapture(event.pointerId);
 event.preventDefault();
});

player.addEventListener("pointermove",event=>{
 if(dragging&&gameRunning)movePlayer(event.clientX);
});

player.addEventListener("pointerup",()=>dragging=false);
player.addEventListener("pointercancel",()=>dragging=false);

function movePlayer(x){
 const rect=field.getBoundingClientRect();
 const pRect=player.getBoundingClientRect();

 const left=Math.max(
  0,
  Math.min(rect.width-pRect.width,x-rect.left-pRect.width/2)
 );

 player.style.left=left+"px";
}

function checkHit(){
 const playerRect=player.getBoundingClientRect();

 document.querySelectorAll(".food").forEach(food=>{
  const foodRect=food.getBoundingClientRect();

  /* 正解の餌は判定を広く、敵は判定を小さくする */
  const isCorrect=food.dataset.correct==="yes";
  const margin=isCorrect ? 16 : -8;

  const hit=
   playerRect.left-margin<foodRect.right &&
   playerRect.right+margin>foodRect.left &&
   playerRect.top-margin<foodRect.bottom &&
   playerRect.bottom+margin>foodRect.top;

  if(!hit)return;

  food.remove();

  if(isCorrect){
   score+=10;
   correct++;
   sound("ok");

   if(correct>=5){
    correct=0;

    if(level<2){
     level++;
     player.classList.remove("grow");
     void player.offsetWidth;
     player.classList.add("grow");
     sound("up");
    }
   }
  }else{
   life--;
   correct=0;
   sound("bad");

   if(life<=0){
    endGame();
    return;
   }
  }

  update();
 });
}

function endGame(){
 if(!gameRunning)return;

 gameRunning=false;
 dragging=false;

 clearInterval(spawnTimer);
 clearInterval(clockTimer);
 clearInterval(hitTimer);
 stopBGM();

 document.querySelectorAll(".food").forEach(food=>food.remove());

 player.style.display="none";
 lifeBox.textContent="";

 const answers=world.chain.map((item,index)=>
  `段階${index+1}：${item[1]} ${item[0]} ← ${item[2].join("・")}`
 ).join("<br>");

 guide.innerHTML=`
 <div class="answer">
  <b>🎮 ゲーム終了！</b><br>
  最終スコア：<b>${score}点</b>
  <hr>
  <b>答え合わせ</b><br>
  ${answers}<br>
  <button onclick="backToMenu()">メニューへ戻る</button>
 </div>
 `;
}

function backToMenu(){
 clearInterval(spawnTimer);
 clearInterval(clockTimer);
 clearInterval(hitTimer);
 stopBGM();

 document.querySelectorAll(".food").forEach(food=>food.remove());

 play.hidden=true;
 menu.hidden=false;
 lifeBox.textContent="❤️❤️❤️";
 guide.textContent="";
 gameRunning=false;
}
</script>
</body>
</html>
